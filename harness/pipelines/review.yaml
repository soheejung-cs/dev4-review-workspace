# 리뷰용 하네스 — 이 YAML 이 실행을 소유한다(tools/harness/pipeline.py 가 읽는다). impl 은 레지스트리 이름.
harness: review
executor: ".51 (리뷰 전용 권고; 벤치·CTP 실행은 review-testing 스킬로 요청자 확인 후 .50/.52)"
stages:
  initialize:                       # 결정론 구간 — LLM 없음
    worktree:   { impl: worktree }                       # PR 헤드 스냅샷(RAII)
    diff_map:   { impl: diff_map }
    codegraph:  { impl: codegraph, scope: changed+1 }    # tree-sitter → SQLite, fingerprint 캐시
  context:                          # 압축 구간 — 예산 안에서만, 초과 시 파일 단위 배치
    pack:       { impl: pack, budget_tokens: 12000 }
    perf_claims: { impl: perf_claims }                    # PR 본문 성능 주장 → MEAS 자동 finding
  # review 단계 = LLM(skills/code-review + rules/성능-리뷰-규칙) : context_pack*.md → findings.json (harness/schemas/finding.json)
  #   러너 밖에서 돈다. 산출물이 오면 adjudicate.yaml 로 이어진다.
