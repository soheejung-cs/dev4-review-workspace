\* the PR, three requesters, only r1 may give up: r2 and r3 wait without a timeout.  A lost wakeup would
\* leave one of them asleep with nothing enabled -- TLC reports that as a deadlock.  Expected: all hold.
SPECIFICATION Spec
CONSTANTS
    H = H
    Req = {r1, r2, r3}
    CanTimeout = {r1}
    FIX = "pr"
INVARIANTS TypeOK FlagSound FlagComplete NoNeedlessWait IdleClean
