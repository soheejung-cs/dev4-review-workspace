\* develop (FIX = "develop"): the give-up path leaves waiter_exists as it is.  H holds the page READ-latched,
\* two requesters with every combination of READ / WRITE, both may give up.  Expected: NoNeedlessWait is
\* violated (a later READ request waits behind no writer).
SPECIFICATION Spec
