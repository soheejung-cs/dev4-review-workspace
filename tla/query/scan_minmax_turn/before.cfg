\* develop (FIX = FALSE): S_GO_BACKWARD resets curr_oidno only.  Expected: MaxIsRight is violated.
\* MaxN 8 / MaxCap 4: every filter over up to 8 rows with buffers of 1..4 OIDs, so the forward row
\* can sit in a later batch and the turn can read a batch shorter than the buffer.
SPECIFICATION Spec
CONSTANTS
    MaxN = 8
    MaxCap = 4
    FIX = FALSE
INVARIANT MaxIsRight
