\* the PR: 2 workers, 3 OIDs (one beyond the width) over 2 partitions, every split of the OIDs between the workers,
\* either worker may fail at any step, start_tasks () may push only one.  Expected: all hold, no deadlock.
SPECIFICATION Spec
CONSTANTS
    W = {1, 2}
    Oids = {1, 2, 3}
    NParts = 2
    PartOf <- PartOfDef
    Over = {3}
    CanFail = {1, 2}
    StartChoices = {{1, 2}, {1}}
    MUT = "pr"
INVARIANTS TypeOK NoDup ResultOK ErrNotLost BarrierSafe OverClosedAtMerge OneTaker FreeLast
PROPERTY Ends
