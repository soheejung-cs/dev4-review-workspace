\* ValueGuard without EarlyMark on T (N (A, B), C): no set operation is left with a value operand, and the statement
\* stays a query, but the fallback folds as develop did. Expected: NoValueOperand and ExecStaysQuery hold.
SPECIFICATION Spec
CONSTANTS
    Nested = TRUE
    ComplexChoice = {FALSE, TRUE}
    WithChoice = {FALSE}
    IntoFix = TRUE
    KeepAtExec = FALSE
    EarlyMark = FALSE
    ValueGuard = TRUE
    TClauseChoice = {"none"}
    ViewChoice = {FALSE}
    GroupChoice = {FALSE}
    PosFix = FALSE
    OrderKeepFix = FALSE
    GroupLimitFix = FALSE
    FIX = TRUE
INVARIANTS NoValueOperand ExecStaysQuery
