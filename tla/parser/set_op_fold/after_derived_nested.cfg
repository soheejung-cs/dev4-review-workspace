\* the fourth commit (Derived) on T (N (A, B), C): a nested set operation all empty folds into a value at compile
\* time and into an empty operand at execution (its mark), the operand left of T under DISTINCT. Expected: all hold.
\* WITH stays off to bound the states (after_derived.cfg covers it on the flat tree).
SPECIFICATION Spec
CONSTANTS
    Nested = TRUE
    ComplexChoice = {FALSE, TRUE}
    WithChoice = {FALSE}
    IntoFix = FALSE
    KeepAtExec = FALSE
    EarlyMark = FALSE
    ValueGuard = FALSE
    TClauseChoice = {"none"}
    ViewChoice = {FALSE}
    GroupChoice = {FALSE}
    PosFix = FALSE
    OrderKeepFix = FALSE
    GroupLimitFix = FALSE
    Derived = TRUE
    FIX = TRUE
INVARIANTS ResultMatches ExecStaysQuery NoValueOperand KindOnlyAllEmpty ScanOnlyWhenKept ExecEmptyReadsNothing IntoFoldsLikeDevelop
